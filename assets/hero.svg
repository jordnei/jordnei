<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Jórdnei Silva — Engenheiro de IA</title>
  <desc id="desc">Banner escuro animado com fluxos de dados, nós e o posicionamento profissional de Jórdnei Silva.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05070B"/>
      <stop offset="0.52" stop-color="#0A1020"/>
      <stop offset="1" stop-color="#071823"/>
    </linearGradient>
    <linearGradient id="flow" x1="600" y1="40" x2="1170" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6"/>
      <stop offset="0.5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(930 180) rotate(90) scale(230 330)">
      <stop stop-color="#2563EB" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#94A3B8" stroke-opacity="0.07"/>
    </pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <clipPath id="rightClip"><rect x="640" width="560" height="360" rx="22"/></clipPath>
  </defs>

  <style>
    .flow-line { stroke-dasharray: 10 16; animation: dataFlow 8s linear infinite; }
    .flow-line.slow { animation-duration: 12s; animation-direction: reverse; }
    .node { transform-box: fill-box; transform-origin: center; animation: pulse 3.4s ease-in-out infinite; }
    .node.delay-1 { animation-delay: .8s; }
    .node.delay-2 { animation-delay: 1.7s; }
    .scan { animation: scan 6s ease-in-out infinite; }
    .line-1, .line-2, .line-3 { animation: cycle 12s ease-in-out infinite; }
    .line-2 { animation-delay: 4s; opacity: 0; }
    .line-3 { animation-delay: 8s; opacity: 0; }
    .cursor { animation: blink .9s steps(1) infinite; }
    @keyframes dataFlow { to { stroke-dashoffset: -260; } }
    @keyframes pulse { 0%, 100% { opacity: .55; transform: scale(.86); } 50% { opacity: 1; transform: scale(1.18); } }
    @keyframes scan { 0%, 100% { transform: translateX(0); opacity: 0; } 15%, 80% { opacity: .38; } 50% { transform: translateX(510px); } }
    @keyframes cycle { 0%, 28% { opacity: 1; transform: translateY(0); } 33%, 95% { opacity: 0; transform: translateY(7px); } 100% { opacity: 1; transform: translateY(0); } }
    @keyframes blink { 0%, 48% { opacity: 1; } 49%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .flow-line, .node, .scan, .line-1, .line-2, .line-3, .cursor { animation: none; }
      .line-2, .line-3 { display: none; }
    }
  </style>

  <rect width="1200" height="360" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="22" fill="url(#grid)"/>
  <rect width="1200" height="360" rx="22" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="358" rx="21" stroke="#60A5FA" stroke-opacity="0.18" stroke-width="2"/>

  <g opacity="0.82" clip-path="url(#rightClip)">
    <path class="flow-line" d="M612 74C738 74 751 151 862 151C974 151 1000 70 1214 70" stroke="url(#flow)" stroke-width="2"/>
    <path class="flow-line slow" d="M610 180C736 180 769 231 875 231C1000 231 1030 142 1220 142" stroke="url(#flow)" stroke-width="2.2"/>
    <path class="flow-line" d="M612 292C741 292 777 265 886 265C1023 265 1063 291 1215 291" stroke="url(#flow)" stroke-width="1.8"/>
    <path d="M686 80L766 136L854 151L928 98L1026 140L1105 74" stroke="#60A5FA" stroke-opacity="0.18"/>
    <path d="M701 279L779 231L872 264L956 217L1044 259L1124 192" stroke="#22D3EE" stroke-opacity="0.14"/>

    <g filter="url(#softGlow)">
      <circle class="node" cx="766" cy="136" r="7" fill="#8B5CF6"/>
      <circle class="node delay-1" cx="862" cy="151" r="8" fill="#3B82F6"/>
      <circle class="node delay-2" cx="928" cy="98" r="6" fill="#22D3EE"/>
      <circle class="node delay-2" cx="779" cy="231" r="6" fill="#8B5CF6"/>
      <circle class="node" cx="872" cy="264" r="8" fill="#3B82F6"/>
      <circle class="node delay-1" cx="956" cy="217" r="6" fill="#22D3EE"/>
      <circle class="node delay-1" cx="1044" cy="259" r="7" fill="#3B82F6"/>
    </g>

    <rect class="scan" x="654" y="38" width="2" height="284" fill="#67E8F9" filter="url(#softGlow)"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="62" y="92" fill="#93C5FD" font-size="15" font-weight="700" letter-spacing="4">ENGENHEIRO DE IA</text>
    <text x="58" y="163" fill="#F8FAFC" font-size="53" font-weight="760" letter-spacing="-1.5" filter="url(#textGlow)">Jórdnei Silva</text>
    <g transform="translate(62 218)" font-size="19" font-weight="520" fill="#CBD5E1">
      <text class="line-1" x="0" y="0">IA generativa · agentes · automação</text>
      <text class="line-2" x="0" y="0">Tecnologia conectada à operação real</text>
      <text class="line-3" x="0" y="0">Produtos úteis, mensuráveis e confiáveis</text>
      <rect class="cursor" x="485" y="-20" width="2.5" height="25" fill="#67E8F9"/>
    </g>
    <text x="62" y="294" fill="#64748B" font-size="14" font-weight="600" letter-spacing="2">TYPESCRIPT  /  LLMS  /  APIS  /  PRODUTO</text>
  </g>
</svg>
