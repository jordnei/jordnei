<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Jórdnei Silva — Engenheiro de IA</title>
  <desc id="desc">Banner minimalista com o nome de Jórdnei Silva, sua área de atuação e um fluxo abstrato de dados.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0F14"/>
      <stop offset="1" stop-color="#101720"/>
    </linearGradient>
    <linearGradient id="accent" x1="760" y1="150" x2="1110" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#64748B"/>
      <stop offset="0.5" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <filter id="dotGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .traveler { animation: travel 7s ease-in-out infinite; }
    .pulse { animation: pulse 3.5s ease-in-out infinite; }
    .pulse.second { animation-delay: 1.1s; }
    .pulse.third { animation-delay: 2.2s; }
    @keyframes travel {
      0%, 10% { transform: translateX(0); opacity: 0; }
      20% { opacity: 1; }
      85% { opacity: 1; }
      95%, 100% { transform: translateX(318px); opacity: 0; }
    }
    @keyframes pulse {
      0%, 100% { opacity: .35; }
      50% { opacity: .9; }
    }
    @media (prefers-reduced-motion: reduce) {
      .traveler, .pulse { animation: none; }
    }
  </style>

  <rect width="1200" height="300" rx="18" fill="url(#background)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="298.5" rx="17.25" stroke="#94A3B8" stroke-opacity="0.14" stroke-width="1.5"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="64" y="77" fill="#7DD3FC" font-size="13" font-weight="700" letter-spacing="3.6">ENGENHEIRO DE IA</text>
    <text x="62" y="145" fill="#F8FAFC" font-size="48" font-weight="700" letter-spacing="-1.2">Jórdnei Silva</text>
    <text x="64" y="190" fill="#A8B3C2" font-size="19" font-weight="400">IA generativa · agentes · automação · integrações</text>
    <rect x="64" y="229" width="38" height="2" rx="1" fill="#38BDF8"/>
    <text x="116" y="235" fill="#64748B" font-size="13" font-weight="600" letter-spacing="1.7">TYPESCRIPT  /  LLMS  /  APIS</text>
  </g>

  <g>
    <path d="M758 150H1108" stroke="#64748B" stroke-opacity="0.32" stroke-width="1.5"/>
    <path d="M828 150C862 150 879 114 914 114C951 114 967 186 1004 186C1041 186 1057 150 1108 150" stroke="url(#accent)" stroke-opacity="0.42" stroke-width="1.5"/>

    <circle class="pulse" cx="828" cy="150" r="4" fill="#94A3B8"/>
    <circle class="pulse second" cx="914" cy="114" r="4" fill="#60A5FA"/>
    <circle class="pulse third" cx="1004" cy="186" r="4" fill="#67E8F9"/>
    <circle cx="1108" cy="150" r="5" fill="#E2E8F0" fill-opacity="0.8"/>

    <g class="traveler" filter="url(#dotGlow)">
      <circle cx="776" cy="150" r="3.5" fill="#38BDF8"/>
    </g>
  </g>
</svg>
