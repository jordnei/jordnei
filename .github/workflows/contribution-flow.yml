name: Atualizar animação de contribuições

on:
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Gerar animações
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/contribution-flow.svg?color_snake=#0969da&color_dots=#ebedf0,#dbeafe,#93c5fd,#3b82f6,#1d4ed8
            dist/contribution-flow-dark.svg?color_snake=#58a6ff&color_dots=#161b22,#0d3b66,#1d5d8f,#2f81f7,#7cc7ff

      - name: Publicar na branch output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan output
          git rm -rf .
          mv dist/contribution-flow.svg contribution-flow.svg
          mv dist/contribution-flow-dark.svg contribution-flow-dark.svg
          git add -f contribution-flow.svg contribution-flow-dark.svg
          git commit -m "chore: update contribution animation"
          git push --force origin output
